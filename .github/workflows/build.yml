name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild quotes.json
        run: node build-quotes.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain quotes.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quotes.json
            git commit -m "ci: rebuild quotes.json"
            git push
          else
            echo "quotes.json already up to date"
          fi
